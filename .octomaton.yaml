apiVersion: octomaton.dev/v1
pipelines:
  - name: ci
    displayName: Continuous Integration
    pipelineRun: .tekton/bundle.yaml
    on:
      pull_request:
        branches: [main]
      merge_group: {}
    params:
      repo-url: "{{ .Repository.CloneURL }}"
      revision: "{{ .Revision }}"
      publish: "false"
  - name: publish
    pipelineRun: .tekton/bundle.yaml
    on:
      push:
        branches: [main]
    params:
      repo-url: "{{ .Repository.CloneURL }}"
      revision: "{{ .Revision }}"
      publish: "true"
    # One publication at a time; a newer push replaces any waiting one.
    concurrency:
      group: publish
      policy: latest
# This is the hub's organization repository (Octomaton's OCTOMATON_ORGANIZATION_REPOSITORY): every repository of
# arikkfir-org runs these pipelines, read from this file at main, and none can replace them.
organization:
  pipelines:
    # The pull request reviewer (arikkfir-org/docs, hub/designs/pr-reviewer.md): requesting a review from
    # arikkfir-reviewer runs reviewer/pipelinerun.yaml, read at this repository's main.
    - name: review
      displayName: AI Review
      pipelineRun: reviewer/pipelinerun.yaml
      on:
        review_request:
          reviewers: [arikkfir-reviewer]
      params:
        repository: "{{ .Repository.FullName }}"
        number: "{{ .PullRequest.Number }}"
        revision: "{{ .Revision }}"
        base-ref: "{{ .PullRequest.BaseRef }}"
        reviewer: "{{ .ReviewRequest.Reviewer }}"
      githubToken:
        workspace: github-token
        permissions: {contents: read, pull_requests: read}
      secrets: [reviewer-deepseek-api-key, reviewer-github-pat]
      timeout: 1h
