apiVersion: octomaton.dev/v1
pipelines:
  - name: ci
    displayName: Continuous Integration
    pipelineRun: .tekton/ci.yaml
    on:
      # Every pull request, whatever its base, so a stacked one is checked before it reaches main.
      pull_request: {}
      merge_group: {}
    params:
      repo-url: "{{ .Repository.CloneURL }}"
      revision: "{{ .Revision }}"
  - name: publish
    pipelineRun: .tekton/publish.yaml
    on:
      push:
        branches: [main]
    params:
      repo-url: "{{ .Repository.CloneURL }}"
      revision: "{{ .Revision }}"
    # One publication at a time; a newer push replaces any waiting one.
    concurrency:
      group: publish
      policy: latest
  # Publish the pull request reviewer's image (reviewer/image, run by reviewer/pipelinerun.yaml) from main, tagged with
  # the commit's short SHA and "main", whenever it changes. The reviewer runs the "main" tag, which each publication
  # moves, so a merge that changes the image reaches the next review.
  - name: reviewer-image
    pipelineRun: .tekton/reviewer-image.yaml
    on:
      push:
        branches: [main]
        paths: [reviewer/image/**, .tekton/reviewer-image.yaml]
    params:
      repo-url: "{{ .Repository.CloneURL }}"
      revision: "{{ .Revision }}"
    timeout: 30m
    # Pushes to main publish the "main" tag: only the newest waiting publication may run.
    concurrency:
      group: reviewer-image
      policy: latest
  # Build the reviewer's image for pull requests that change it, without pushing it.
  - name: reviewer-image-check
    displayName: Reviewer Image
    pipelineRun: .tekton/reviewer-image-check.yaml
    on:
      pull_request:
        paths: [reviewer/image/**, .tekton/reviewer-image-check.yaml]
    params:
      repo-url: "{{ .Repository.CloneURL }}"
      revision: "{{ .Revision }}"
    timeout: 30m
# This is the hub's organization repository (Octomaton's OCTOMATON_ORGANIZATION_REPOSITORY): every repository of
# arikkfir-org runs these pipelines, read from this file at main, and none can replace them.
organization:
  pipelines:
    # The pull request reviewer (https://docs.dev.kfirs.com/tooling/designs/pr-reviewer.md): requesting a review from
    # arikkfir-reviewer runs reviewer/pipelinerun.yaml, read at this repository's main.
    - name: review
      displayName: AI Review
      pipelineRun: reviewer/pipelinerun.yaml
      on:
        review_request:
          reviewers: [arikkfir-reviewer]
      params:
        repository: "{{ .Repository.FullName }}"
        name: "{{ .Repository.Name }}"
        number: "{{ .PullRequest.Number }}"
        revision: "{{ .Revision }}"
        base-ref: "{{ .PullRequest.BaseRef }}"
        reviewer: "{{ .ReviewRequest.Reviewer }}"
      # Reads the code and pull requests of every repository: review's clone step reads GitHub with it, and its github
      # sidecar serves GitHub to the model with it.
      githubToken:
        workspace: github-token
        permissions: {contents: read, pull_requests: read}
        repositories: all
      secrets: [reviewer-deepseek-api-key, reviewer-github-pat]
      timeout: 1h
    # The docs site (arikkfir-org/docs, hub/designs/docs-site-composition.md): every repository's docs (the docs
    # repository's whole tree, any other's docs/) are checked against the other repositories' published layers on pull
    # requests and in the merge queue, and published to the repository's own layer on every push to main.
    - name: docs
      displayName: Docs
      pipelineRun: docs-site/check.yaml
      on:
        # Every pull request, whatever its base, so a stacked one is checked before it reaches main.
        pull_request: {}
        merge_group: {}
      params:
        repository: "{{ .Repository.FullName }}"
        revision: "{{ .Revision }}"
      githubToken:
        workspace: github-token
    - name: docs-publish
      pipelineRun: docs-site/publish.yaml
      on:
        push:
          branches: [main]
      params:
        repository: "{{ .Repository.FullName }}"
        revision: "{{ .Revision }}"
      githubToken:
        workspace: github-token
      # One publication at a time; a newer push replaces any waiting one.
      concurrency:
        group: docs-publish
        policy: latest
    # Check Linear (docs/tooling/designs/linear-check.md): every pull request links a Linear issue or carries the label
    # skip-linear (CONTRIBUTING.md in arikkfir-org/docs, "Linear"). linear/check.py asks Linear's API, with a read-only
    # key that Octomaton lets this pipeline mount only because it is read here, at main.
    - name: linear
      displayName: Linear
      pipelineRun: linear/check.yaml
      on:
        # Every pull request, whatever its base. Its description and labels decide the check, so editing them runs it
        # again at the same commit, and each new head commit needs a check of its own.
        pull_request:
          types: [opened, reopened, synchronize, edited, labeled, unlabeled]
        # The merge queue requires the check too. A merge group passes without asking Linear: its pull requests
        # passed the check to enter the queue.
        merge_group: {}
      params:
        repository: "{{ .Repository.FullName }}"
        number: "{{ if .PullRequest }}{{ .PullRequest.Number }}{{ end }}"
        merge-group: "{{ if .MergeGroup }}{{ .MergeGroup.HeadRef }}{{ end }}"
      # Reads the pull request: its labels and its address.
      githubToken:
        workspace: github-token
        permissions: {pull_requests: read}
      secrets: [linear-api-key]
      timeout: 5m
  # Octomaton's built-in "/rerun [check...]" (https://docs.dev.kfirs.com/octomaton/designs/comment-commands.md): on any
  # pull request of the organization, those listed may re-run its failed checks, or the named ones, by comment.
  commands:
    rerun:
      allow:
        users: [arikkfir]
