apiVersion: octomaton.dev/v1
pipelines:
  - name: ci
    displayName: Continuous Integration
    pipelineRun: .tekton/ci.yaml
    on:
      pull_request:
        branches: [main]
      merge_group: {}
    params:
      repo-url: "{{ .Repository.CloneURL }}"
      revision: "{{ .Revision }}"
  - name: publish
    pipelineRun: .tekton/publish.yaml
    on:
      push:
        branches: [main]
    params:
      repo-url: "{{ .Repository.CloneURL }}"
      revision: "{{ .Revision }}"
    # One publication at a time; a newer push replaces any waiting one.
    concurrency:
      group: publish
      policy: latest
# This is the hub's organization repository (Octomaton's OCTOMATON_ORGANIZATION_REPOSITORY): every repository of
# arikkfir-org runs these pipelines, read from this file at main, and none can replace them.
organization:
  pipelines:
    # The pull request reviewer (arikkfir-org/docs, hub/designs/pr-reviewer.md): requesting a review from
    # arikkfir-reviewer runs reviewer/pipelinerun.yaml, read at this repository's main.
    - name: review
      displayName: AI Review
      pipelineRun: reviewer/pipelinerun.yaml
      on:
        review_request:
          reviewers: [arikkfir-reviewer]
      params:
        repository: "{{ .Repository.FullName }}"
        number: "{{ .PullRequest.Number }}"
        revision: "{{ .Revision }}"
        base-ref: "{{ .PullRequest.BaseRef }}"
        reviewer: "{{ .ReviewRequest.Reviewer }}"
      githubToken:
        workspace: github-token
        permissions: {contents: read, pull_requests: read}
      secrets: [reviewer-deepseek-api-key, reviewer-github-pat]
      timeout: 1h
    # The docs site (arikkfir-org/docs, hub/designs/docs-site-composition.md): every repository's docs (the docs
    # repository's whole tree, any other's docs/) are checked against the other repositories' published layers on pull
    # requests and in the merge queue, and published to the repository's own layer on every push to main.
    - name: docs
      displayName: Docs
      pipelineRun: docs-site/check.yaml
      on:
        pull_request:
          branches: [main]
        merge_group: {}
      params:
        repository: "{{ .Repository.FullName }}"
        revision: "{{ .Revision }}"
      githubToken:
        workspace: github-token
    - name: docs-publish
      pipelineRun: docs-site/publish.yaml
      on:
        push:
          branches: [main]
      params:
        repository: "{{ .Repository.FullName }}"
        revision: "{{ .Revision }}"
      githubToken:
        workspace: github-token
      # One publication at a time; a newer push replaces any waiting one.
      concurrency:
        group: docs-publish
        policy: latest
