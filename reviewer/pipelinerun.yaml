# The pull request reviewer (https://github.com/arikkfir-org/docs/blob/main/hub/designs/pr-reviewer.md). Octomaton runs
# it when a review is requested from arikkfir-reviewer, reading this file at tooling's default branch for every
# repository. It sets spec.params and binds workspace github-token, an installation token that reads the code and pull
# requests of every repository of the organization. setup checks out the pull request's repository on the volume, with
# pr.json, pr.diff and pr.log at its root, review has opencode write findings.json there (its github sidecar serves
# GitHub to the model with the token, so the model clones any other repository it needs), and report posts them as one
# review by arikkfir-reviewer.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: review-
  labels:
    # Tekton copies it to every TaskRun pod: NetworkPolicy sandbox limits them to the internet.
    kfirs.com/sandbox: "true"
spec:
  # Octomaton sets every value; the empty ones satisfy Tekton's schema, which requires one.
  params:
    - name: repository
      value: ""
    - name: name
      value: ""
    - name: number
      value: ""
    - name: revision
      value: ""
    - name: base-ref
      value: ""
    - name: reviewer
      value: ""
  timeouts:
    pipeline: 1h
  taskRunTemplate:
    serviceAccountName: reviewer
    podTemplate:
      # Cluster DNS is inside the ranges the sandbox denies.
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 8.8.8.8
          - 1.1.1.1
      automountServiceAccountToken: false
      enableServiceLinks: false
  # Reserved once for all of a task's steps (step-level requests would add up as if the steps ran at once). setup
  # clones two repositories and diffs one. review runs opencode, a Bun process that holds the whole session and runs
  # ripgrep over the clones, while the model itself runs at DeepSeek; its github sidecar has its own resources.
  # report only calls GitHub's API.
  taskRunSpecs:
    - pipelineTaskName: setup
      computeResources:
        requests:
          cpu: 500m
          memory: 512Mi
        limits:
          memory: 1Gi
    - pipelineTaskName: review
      computeResources:
        requests:
          cpu: "1"
          memory: 2Gi
        limits:
          memory: 4Gi
    - pipelineTaskName: report
      computeResources:
        requests:
          cpu: 250m
          memory: 256Mi
        limits:
          memory: 512Mi
  workspaces:
    - name: shared
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 50Gi
  pipelineSpec:
    params:
      - name: repository
        type: string
      - name: name
        type: string
      - name: number
        type: string
      - name: revision
        type: string
      - name: base-ref
        type: string
      - name: reviewer
        type: string
    workspaces:
      - name: shared
      - name: github-token
    results:
      - name: check-title
        value: $(tasks.report.results.check-title)
      - name: check-summary
        value: $(tasks.report.results.check-summary)
    tasks:
      - name: setup
        retries: 2
        timeout: 10m
        workspaces:
          - name: shared
            workspace: shared
          - name: github-token
            workspace: github-token
        params:
          - name: repository
            value: $(params.repository)
          - name: name
            value: $(params.name)
          - name: number
            value: $(params.number)
          - name: revision
            value: $(params.revision)
          - name: base-ref
            value: $(params.base-ref)
          - name: reviewer
            value: $(params.reviewer)
        taskSpec:
          params:
            - name: repository
              type: string
            - name: name
              type: string
            - name: number
              type: string
            - name: revision
              type: string
            - name: base-ref
              type: string
            - name: reviewer
              type: string
          workspaces:
            - name: shared
            - name: github-token
          stepTemplate:
            workingDir: $(workspaces.shared.path)
            env:
              - name: REPOSITORY
                value: $(params.repository)
              - name: NAME
                value: $(params.name)
              - name: NUMBER
                value: $(params.number)
              - name: REVISION
                value: $(params.revision)
              - name: BASE_REF
                value: $(params.base-ref)
              - name: REVIEWER
                value: $(params.reviewer)
          steps:
            - name: clone
              image: docker.io/alpine/git:2.54.0
              script: |
                #!/bin/sh
                set -eu
                rm -rf .review "${NAME}"
                # The pull request's repository may be internal or private, so cloning it and fetching the pull
                # request always take the read-only token: one path for every review, and no visibility check. git
                # gets it as an HTTP header on its command line only, never in a .git/config, a URL or a credential
                # helper, so nothing on the volume, which review's model reads, holds it.
                token="$(cat "$(workspaces.github-token.path)/token")"
                credentials="$(printf 'x-access-token:%s' "${token}" | base64 | tr -d '\n')"
                auth="http.extraHeader=Authorization: Basic ${credentials}"
                git -c "${auth}" clone --quiet "https://github.com/${REPOSITORY}.git" "${NAME}"
                cd "${NAME}"
                git -c "${auth}" fetch --quiet origin "+refs/pull/${NUMBER}/head"
                head="$(git rev-parse FETCH_HEAD)"
                if [ "${head}" != "${REVISION}" ]; then
                  echo "Pull request #${NUMBER} is at ${head}, not ${REVISION}; request a new review." >&2
                  exit 1
                fi
                git -c advice.detachedHead=false checkout --quiet --detach "${REVISION}"
                # The checkout is the model's working directory, with the pull request's files at its root. The pull
                # request controls the checkout, so none of them may already be there: a symlink would send this
                # step's or a later one's writes anywhere on the volume, .review/ included.
                for file in pr.json pr.diff pr.log findings.json; do
                  if [ -e "${file}" ] || [ -L "${file}" ]; then
                    echo "${REPOSITORY} has a ${file} at its root, where the reviewer puts its own." >&2
                    exit 1
                  fi
                done
                git diff "origin/${BASE_REF}...${REVISION}" > pr.diff
                git log --stat "origin/${BASE_REF}..${REVISION}" > pr.log
                cd ..
                # The prompt and scripts come from tooling's default branch, never from a pull request's head.
                tooling="$(mktemp -d)"
                git clone --quiet --depth 1 https://github.com/arikkfir-org/tooling.git "${tooling}"
                mkdir .review
                git -C "${tooling}" archive HEAD:reviewer | tar -x -C .review
            - name: state
              image: gcr.io/google.com/cloudsdktool/google-cloud-cli:587.0.0-slim
              script: |
                #!/bin/sh
                set -eu
                exec python3 .review/state.py --repository "${REPOSITORY}" --number "${NUMBER}" \
                  --revision "${REVISION}" --base-ref "${BASE_REF}" --reviewer "${REVIEWER}" \
                  --token-file "$(workspaces.github-token.path)/token" --output "${NAME}/pr.json"
      - name: review
        runAfter:
          - setup
        retries: 1
        timeout: 40m
        workspaces:
          - name: shared
            workspace: shared
          - name: github-token
            workspace: github-token
        params:
          - name: name
            value: $(params.name)
        taskSpec:
          params:
            - name: name
              type: string
          workspaces:
            - name: shared
            - name: github-token
          # The token is the github sidecar's alone: a workspace a sidecar names is mounted only there (Tekton's
          # isolated workspaces, a beta feature; without it the run is refused). The model reaches GitHub through the
          # sidecar on 127.0.0.1:8080 (reviewer/github_proxy.py), never with the token.
          sidecars:
            - name: github
              image: me-west1-docker.pkg.dev/arikkfir/images/reviewer:c63d03b@sha256:dd2de95039d7990344dc6451c533974cae82ae1fea884136cedc7ab0b1478cc9
              workspaces:
                - name: github-token
                  mountPath: /workspace/github-token
              computeResources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              # The steps start once it answers.
              readinessProbe:
                exec:
                  command: [curl, --fail, --silent, --output, /dev/null, "http://127.0.0.1:8080/healthz"]
                periodSeconds: 2
              script: |
                #!/bin/sh
                set -eu
                # Its own copy of tooling's default branch, as report's: the model can rewrite anything on the volume.
                git clone --quiet --depth 1 https://github.com/arikkfir-org/tooling.git /tmp/tooling
                exec python3 /tmp/tooling/reviewer/github_proxy.py --token-file /workspace/github-token/token
          # The model works in the pull request's checkout; .review/, beside it, holds the scripts and opencode's state.
          stepTemplate:
            workingDir: $(workspaces.shared.path)/$(params.name)
            env:
              - name: DEEPSEEK_API_KEY
                valueFrom:
                  secretKeyRef:
                    name: reviewer-deepseek-api-key
                    key: api-key
              # fix continues review's session, and steps share only volumes.
              - name: HOME
                value: $(workspaces.shared.path)/.review/home
              - name: XDG_CONFIG_HOME
                value: $(workspaces.shared.path)/.review/home/.config
              - name: XDG_DATA_HOME
                value: $(workspaces.shared.path)/.review/home/.local/share
              - name: XDG_STATE_HOME
                value: $(workspaces.shared.path)/.review/home/.local/state
              - name: XDG_CACHE_HOME
                value: $(workspaces.shared.path)/.review/home/.cache
              # The working directory is the pull request's checkout, and no opencode.json, .opencode/, plugin, skill or
              # CLAUDE.md from it configures opencode. opencode's read tool still hands the model an AGENTS.md or
              # CONTEXT.md from a subdirectory of the checkout as instructions; no setting turns that off.
              - name: OPENCODE_CONFIG
                value: $(workspaces.shared.path)/.review/opencode.json
              - name: OPENCODE_DISABLE_PROJECT_CONFIG
                value: "1"
              - name: OPENCODE_DISABLE_EXTERNAL_SKILLS
                value: "1"
              - name: OPENCODE_DISABLE_CLAUDE_CODE_PROMPT
                value: "1"
              - name: OPENCODE_DISABLE_SHARE
                value: "1"
              - name: OPENCODE_DISABLE_MODELS_FETCH
                value: "1"
              - name: OPENCODE_DISABLE_AUTOUPDATE
                value: "1"
          steps:
            - name: review
              image: me-west1-docker.pkg.dev/arikkfir/images/reviewer:c63d03b@sha256:dd2de95039d7990344dc6451c533974cae82ae1fea884136cedc7ab0b1478cc9
              script: |
                #!/bin/sh
                set -eu
                # The token is the github sidecar's alone: never run the model where it can read it.
                if [ -e /workspace/github-token ]; then
                  echo "The GitHub token is mounted in this step; refusing to run the model." >&2
                  exit 1
                fi
                rm -f findings.json ../.review/errors.txt
                # opencode installs its plugin package into its config directory unless node_modules exists and
                # package-lock.json lists the package (Npm.install in 1.18.33).
                mkdir -p "${XDG_CONFIG_HOME}/opencode/node_modules"
                echo '{"packages": {"": {"dependencies": {"@opencode-ai/plugin": "1.18.33"}}}}' \
                  > "${XDG_CONFIG_HOME}/opencode/package-lock.json"
                # Low reasoning effort: the review is many short turns of reading and searching.
                opencode run --pure --variant low --format default < ../.review/prompt.md
            - name: check
              image: gcr.io/google.com/cloudsdktool/google-cloud-cli:587.0.0-slim
              script: |
                #!/bin/sh
                set -eu
                python3 ../.review/findings.py check --state pr.json --findings findings.json \
                  --errors ../.review/errors.txt
            - name: fix
              image: me-west1-docker.pkg.dev/arikkfir/images/reviewer:c63d03b@sha256:dd2de95039d7990344dc6451c533974cae82ae1fea884136cedc7ab0b1478cc9
              script: |
                #!/bin/sh
                set -eu
                # The token is the github sidecar's alone: never run the model where it can read it.
                if [ -e /workspace/github-token ]; then
                  echo "The GitHub token is mounted in this step; refusing to run the model." >&2
                  exit 1
                fi
                if [ ! -s ../.review/errors.txt ]; then
                  echo "findings.json is valid; nothing to fix."
                  exit 0
                fi
                {
                  echo "findings.json breaks these rules. Fix each one in findings.json, then read the file back:"
                  echo
                  sed 's/^/- /' ../.review/errors.txt
                } | opencode run --pure --continue --variant low --format default
            - name: recheck
              image: gcr.io/google.com/cloudsdktool/google-cloud-cli:587.0.0-slim
              script: |
                #!/bin/sh
                set -eu
                python3 ../.review/findings.py check --strict --state pr.json --findings findings.json
      - name: report
        runAfter:
          - review
        retries: 2
        timeout: 10m
        workspaces:
          - name: shared
            workspace: shared
        params:
          - name: repository
            value: $(params.repository)
          - name: name
            value: $(params.name)
          - name: number
            value: $(params.number)
          - name: revision
            value: $(params.revision)
          - name: run
            value: $(context.pipelineRun.name)
        taskSpec:
          params:
            - name: repository
              type: string
            - name: name
              type: string
            - name: number
              type: string
            - name: revision
              type: string
            - name: run
              type: string
          workspaces:
            - name: shared
              readOnly: true
          results:
            - name: check-title
              type: string
            - name: check-summary
              type: string
          # The model could have rewritten anything on the volume, so report runs its own copy of tooling's default
          # branch and reads only findings.json from the volume, as data.
          volumes:
            - name: tools
              emptyDir: {}
          stepTemplate:
            volumeMounts:
              - name: tools
                mountPath: /tools
          steps:
            - name: fetch
              image: docker.io/alpine/git:2.54.0
              script: |
                #!/bin/sh
                set -eu
                git clone --quiet --depth 1 https://github.com/arikkfir-org/tooling.git /tools/tooling
            - name: report
              image: gcr.io/google.com/cloudsdktool/google-cloud-cli:587.0.0-slim
              env:
                - name: GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: reviewer-github-pat
                      key: token
                - name: REPOSITORY
                  value: $(params.repository)
                - name: NUMBER
                  value: $(params.number)
                - name: REVISION
                  value: $(params.revision)
                - name: RUN
                  value: $(params.run)
              script: |
                #!/bin/sh
                set -eu
                exec python3 /tools/tooling/reviewer/report.py --repository "${REPOSITORY}" --number "${NUMBER}" \
                  --revision "${REVISION}" --run "${RUN}" \
                  --findings "$(workspaces.shared.path)/$(params.name)/findings.json" \
                  --title-file "$(results.check-title.path)" --summary-file "$(results.check-summary.path)"
