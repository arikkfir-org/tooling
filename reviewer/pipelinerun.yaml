# The pull request reviewer (https://docs.dev.kfirs.com/tooling/designs/pr-reviewer.md). Octomaton runs
# it when a review is requested from arikkfir-reviewer, reading this file and its Task review (review.task.yaml, which
# it inlines) at tooling's default branch for every repository. It sets spec.params and binds workspace github-token,
# an installation token that reads the code and pull requests of every repository of the organization. review checks
# out the pull request's repository on the volume, with
# pr.json, pr.diff and pr.log at its root, then has opencode write findings.json there (its github sidecar serves GitHub
# to the model with the token, so the model clones any other repository it needs), and its last step, report, posts
# them as one review by arikkfir-reviewer: one pod per review. Every step and the sidecar run in the reviewer image,
# which has bash, git and python3 besides the model's tools, so a node pulls one image for a review. They run its main
# tag, which this repository's reviewer-image moves on every change, and pull it for every pod, so no node runs a main it
# cached earlier.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: review-
  labels:
    # Tekton copies it to every TaskRun pod: NetworkPolicy sandbox limits them to the internet.
    kfirs.com/sandbox: "true"
spec:
  # Octomaton sets every value; the empty ones satisfy Tekton's schema, which requires one.
  params:
    - name: repository
      value: ""
    - name: name
      value: ""
    - name: number
      value: ""
    - name: revision
      value: ""
    - name: base-ref
      value: ""
    - name: reviewer
      value: ""
  timeouts:
    pipeline: 1h
  taskRunTemplate:
    serviceAccountName: reviewer
    podTemplate:
      # Cluster DNS is inside the ranges the sandbox denies.
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 8.8.8.8
          - 1.1.1.1
      automountServiceAccountToken: false
      enableServiceLinks: false
  # Reserved once for all of a task's steps (step-level requests would add up as if the steps ran at once), and sized
  # from the 18 reviews of 2026-10-02: requests near typical use, so concurrent reviews share a node instead of waiting
  # for another, and limits well above the peaks. review clones two repositories and diffs one (18 MiB at most), then
  # runs opencode, a Bun process that holds the whole session and runs ripgrep over the clones, while the model itself
  # runs at DeepSeek: 0.57 of a core on average, up to 0.93, and 620 MiB in 9 reviews of 10, 950 MiB at most. CPU is
  # unlimited, so it uses idle cores beyond its request. Its github sidecar has its own resources. The report step only
  # calls GitHub's API (18 MiB), well within the task's.
  taskRunSpecs:
    - pipelineTaskName: review
      computeResources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          memory: 4Gi
  workspaces:
    - name: shared
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 50Gi
  pipelineSpec:
    params:
      - name: repository
        type: string
      - name: name
        type: string
      - name: number
        type: string
      - name: revision
        type: string
      - name: base-ref
        type: string
      - name: reviewer
        type: string
    workspaces:
      - name: shared
      - name: github-token
    results:
      - name: check-title
        value: $(tasks.review.results.check-title)
      - name: check-summary
        value: $(tasks.review.results.check-summary)
    tasks:
      - name: review
        # No retries: a failure ends the run at once, with its error on the check. Tekton stops a pod's sidecars only
        # once its TaskRun is done, which a retried attempt never is, so a retry left the failed pod's github sidecar
        # running, holding the volume that the retry's pod, on another node, waited for until the run was cancelled
        # (docs/tooling/root-causes/2026-11-02-failed-reviews-never-end.md). A run that loses its pod to the cluster
        # runs again through Octomaton's disruption reruns (.octomaton.yaml), with a volume of its own.
        timeout: 55m
        workspaces:
          - name: shared
            workspace: shared
          - name: github-token
            workspace: github-token
        params:
          - name: repository
            value: $(params.repository)
          - name: name
            value: $(params.name)
          - name: number
            value: $(params.number)
          - name: revision
            value: $(params.revision)
          - name: base-ref
            value: $(params.base-ref)
          - name: reviewer
            value: $(params.reviewer)
          - name: run
            value: $(context.pipelineRun.name)
        taskRef:
          name: review # reviewer/review.task.yaml
