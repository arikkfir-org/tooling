# Builds and verifies the Claude Code bundle; when publish is "true", uploads it and the setup script to the public
# arikkfir-claude bucket. Octomaton runs it as "ci" (pull requests, merge queue) and "publish" (main); see
# .octomaton.yaml.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: tooling-bundle-
spec:
  timeouts:
    pipeline: 20m
  taskRunTemplate:
    serviceAccountName: pipeline
  workspaces:
    - name: source
      emptyDir: {}
  pipelineSpec:
    params:
      - name: repo-url
        type: string
      - name: revision
        type: string
      - name: publish
        type: string
        default: "false"
      - name: bucket
        type: string
        default: arikkfir-claude
    workspaces:
      - name: source
    tasks:
      - name: bundle
        workspaces:
          - name: source
            workspace: source
        params:
          - name: repo-url
            value: $(params.repo-url)
          - name: revision
            value: $(params.revision)
          - name: publish
            value: $(params.publish)
          - name: bucket
            value: $(params.bucket)
        taskSpec:
          params:
            - name: repo-url
              type: string
            - name: revision
              type: string
            - name: publish
              type: string
            - name: bucket
              type: string
          workspaces:
            - name: source
          stepTemplate:
            workingDir: $(workspaces.source.path)
            env:
              - name: REPO_URL
                value: $(params.repo-url)
              - name: REVISION
                value: $(params.revision)
              - name: PUBLISH
                value: $(params.publish)
              - name: BUCKET
                value: $(params.bucket)
          steps:
            - name: build
              image: alpine/git:v2.54.0
              script: |
                #!/bin/sh
                set -eu
                git init --quiet .
                git remote add origin "$REPO_URL"
                git fetch --quiet --depth=1 origin "$REVISION"
                git checkout --quiet FETCH_HEAD
                sh scripts/build.sh
            - name: lint
              image: koalaman/shellcheck-alpine:v0.11.0
              script: |
                #!/bin/sh
                set -eu
                shellcheck setup/setup.sh scripts/build.sh tests/test_setup.sh
            - name: test
              image: gcr.io/google.com/cloudsdktool/google-cloud-cli:586.0.0-slim
              script: |
                #!/usr/bin/env bash
                set -euo pipefail
                python3 -m unittest discover -s tests -v
                python3 scripts/verify.py dist/content
                bash tests/test_setup.sh
            - name: scan
              image: zricethezav/gitleaks:v8.30.1
              script: |
                #!/bin/sh
                set -eu
                gitleaks dir dist/content --no-banner --redact --verbose
                gitleaks dir . --no-banner --redact
            - name: publish
              image: gcr.io/google.com/cloudsdktool/google-cloud-cli:586.0.0-slim
              script: |
                #!/usr/bin/env bash
                set -euo pipefail
                if [[ "$PUBLISH" != "true" ]]; then
                  echo "Verification only; nothing published."
                  exit 0
                fi
                # Bundles are content-addressed and immutable; upload them before the setup script that points at them.
                gcloud storage rsync dist/bundles "gs://${BUCKET}/bundles" --recursive --checksums-only \
                  --cache-control="public, max-age=31536000, immutable"
                gcloud storage rsync dist "gs://${BUCKET}" --checksums-only --exclude='bundles/|content/' \
                  --cache-control="no-cache"
