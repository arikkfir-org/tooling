# Publishes the Claude Code bundle on every push to main ("publish" in .octomaton.yaml): builds it, verifies and scans
# what it uploads, then uploads it and the setup script to the public arikkfir-claude bucket. The merge queue already
# ran .tekton/ci.yaml on this exact commit. It runs as ci-tooling-publish, which only main may use
# (octomaton.dev/branches).
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: tooling-publish-
spec:
  timeouts:
    pipeline: 20m
  taskRunTemplate:
    serviceAccountName: ci-tooling-publish
  # Reserved once for all of the task's steps (step-level requests would add up as if the steps ran at once).
  taskRunSpecs:
    - pipelineTaskName: bundle
      computeResources:
        requests:
          cpu: 500m
          memory: 512Mi
        limits:
          memory: 1Gi
  workspaces:
    - name: source
      emptyDir: {}
  pipelineSpec:
    params:
      - name: repo-url
        type: string
      - name: revision
        type: string
      - name: bucket
        type: string
        default: arikkfir-claude
    workspaces:
      - name: source
    tasks:
      - name: bundle
        workspaces:
          - name: source
            workspace: source
        params:
          - name: repo-url
            value: $(params.repo-url)
          - name: revision
            value: $(params.revision)
          - name: bucket
            value: $(params.bucket)
        taskSpec:
          params:
            - name: repo-url
              type: string
            - name: revision
              type: string
            - name: bucket
              type: string
          workspaces:
            - name: source
          stepTemplate:
            workingDir: $(workspaces.source.path)
            env:
              - name: REPO_URL
                value: $(params.repo-url)
              - name: REVISION
                value: $(params.revision)
              - name: BUCKET
                value: $(params.bucket)
          steps:
            - name: build
              image: alpine/git:v2.54.0
              script: |
                #!/bin/sh
                set -eu
                git init --quiet .
                git remote add origin "$REPO_URL"
                git fetch --quiet --depth=1 origin "$REVISION"
                git checkout --quiet FETCH_HEAD
                sh scripts/build.sh
            - name: verify
              image: gcr.io/google.com/cloudsdktool/google-cloud-cli:587.0.0-slim
              script: |
                #!/usr/bin/env bash
                set -euo pipefail
                python3 scripts/verify.py dist/content
            - name: scan
              image: zricethezav/gitleaks:v8.30.1
              script: |
                #!/bin/sh
                set -eu
                gitleaks dir dist/content --no-banner --redact --verbose
            - name: upload
              image: gcr.io/google.com/cloudsdktool/google-cloud-cli:587.0.0-slim
              script: |
                #!/usr/bin/env bash
                set -euo pipefail
                # Bundles are content-addressed and immutable; upload them before the setup script that points at them.
                gcloud storage rsync dist/bundles "gs://${BUCKET}/bundles" --recursive --checksums-only \
                  --cache-control="public, max-age=31536000, immutable"
                gcloud storage rsync dist "gs://${BUCKET}" --checksums-only --exclude='bundles/|content/' \
                  --cache-control="no-cache"
